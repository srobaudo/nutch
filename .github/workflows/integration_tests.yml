name: integration tests

on: [push]

jobs:
  integration-tests:
    strategy:
      matrix:
        java: ['11']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    services:
      elasticsearch8:
        image: elasticsearch:8.18.4
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          xpack.security.enrollment.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 60s
      elasticsearch9:
        image: elasticsearch:9.0.4
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          xpack.security.enrollment.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.5.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: dorny/paths-filter@v3.0.0
        id: filter
        with:
          filters: |
            elastic:
              - 'src/plugin/indexer-elastic/**'
            buildconf:
              - 'build.xml'
              - 'ivy/ivy.xml'
            workflow:
              - '.github/workflows/**'
      # Only run integration tests if elastic plugin, build config, or workflow changed
      - name: integration tests
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Starting Elasticsearch integration tests..."
          echo "ES8 available at localhost:9200, ES9 available at localhost:9201"
          # Wait for ES to be ready
          timeout 60 bash -c 'until curl -f http://localhost:9200/_cluster/health; do echo "Waiting for ES8..."; sleep 5; done'
          timeout 60 bash -c 'until curl -f http://localhost:9201/_cluster/health; do echo "Waiting for ES9..."; sleep 5; done'
          ant clean integration-test -buildfile build.xml