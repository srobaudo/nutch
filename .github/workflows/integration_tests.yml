name: integration tests

on: [push]

jobs:
  integration-tests:
    strategy:
      matrix:
        java: ['17']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    services:
      elasticsearch8:
        image: elasticsearch:8.18.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
      elasticsearch9:
        image: elasticsearch:9.0.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.5.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: dorny/paths-filter@v3.0.0
        id: filter
        with:
          filters: |
            elastic:
              - 'src/plugin/indexer-elastic/**'
            buildconf:
              - 'build.xml'
              - 'ivy/ivy.xml'
            workflow:
              - '.github/workflows/**'
      # Only run integration tests if elastic plugin, build config, or workflow changed
      - name: Check Elasticsearch versions
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Checking Elasticsearch services..."
          docker --version
          
      - name: Wait for Elasticsearch Services
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Waiting for Elasticsearch services to be ready..."
          
          # Function to wait for ES instance with shorter timeouts
          wait_for_es() {
            local port=$1
            local version=$2
            echo "Waiting for ES$version on port $port..."
            
            for i in {1..30}; do # Reduced from 60 to 30
              if curl -s --connect-timeout 2 --max-time 3 "http://localhost:$port/_cluster/health" > /dev/null 2>&1; then
                local health=$(curl -s --connect-timeout 2 --max-time 3 "http://localhost:$port/_cluster/health")
                if echo "$health" | grep -q '"status":"green"\|"status":"yellow"'; then
                  echo "ES$version is ready on port $port"
                  return 0
                fi
              fi
              echo "ES$version not ready yet, waiting... ($i/30)"
              sleep 3 # Reduced from 5 to 3 seconds
            done
            
            echo "ES$version failed to become ready on port $port after 30 attempts"
            return 1
          }
          
          # Wait for both instances in parallel with timeout
          timeout 120s bash -c '
            wait_for_es() {
              local port=$1
              local version=$2
              for i in {1..30}; do
                if curl -s --connect-timeout 2 --max-time 3 "http://localhost:$port/_cluster/health" > /dev/null 2>&1; then
                  local health=$(curl -s --connect-timeout 2 --max-time 3 "http://localhost:$port/_cluster/health")
                  if echo "$health" | grep -q "\"status\":\"green\"\\|\"status\":\"yellow\""; then
                    echo "ES$version is ready on port $port"
                    return 0
                  fi
                fi
                echo "ES$version not ready yet, waiting... ($i/30)"
                sleep 3
              done
              return 1
            }
            
            wait_for_es 9200 8 &
            wait_for_es 9201 9 &
            wait
          '
          
      - name: integration tests
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Starting Elasticsearch integration tests..."
          echo "ES8 available at localhost:9200, ES9 available at localhost:9201"
          
          # Show environment info
          echo "Java version:"
          java -version
          echo "Ant version:"
          ant -version
          echo "Current directory: $(pwd)"
          echo "Available memory: $(free -h)"
          echo "Current user: $(whoami)"
          echo "Environment variables:"
          env | grep -E "(JAVA|ANT|PATH)" | head -10
          
          # Show process info
          echo "Current processes:"
          ps aux | head -10
          
          # Final health verification
          echo "Final ES8 health check:"
          curl -s http://localhost:9200/_cluster/health | jq '.' || curl -s http://localhost:9200/_cluster/health
          echo ""
          echo "Final ES9 health check:"
          curl -s http://localhost:9201/_cluster/health | jq '.' || curl -s http://localhost:9201/_cluster/health
          echo ""
          
          # Set system properties for log4j2 - use simple concrete paths  
          export ANT_OPTS="-Dnutch.log.dir=/tmp/nutch-logs -Dnutch.log.file=test.log -Djava.io.tmpdir=/tmp -Xmx2g"
          echo "ANT_OPTS set to: $ANT_OPTS"
          
          # Create log directory
          mkdir -p /tmp/nutch-logs
          echo "Created log directory: /tmp/nutch-logs"
          
          # Show ant targets available
          echo "Available ant targets:"
          ant -p | grep -E "(integration|test|connectivity)" || echo "No integration/test targets found"
          
          # Run the most basic test first - just compile  
          echo "Step 1: Testing compilation..."
          timeout 60s ant compile-core-test || { 
            echo "Compilation failed or timed out"; 
            echo "Checking ant processes...";
            ps aux | grep ant || true;
            exit 1; 
          }
          echo "Compilation successful"
          
          # Run very basic unit test to verify JUnit works
          echo "Step 2: Running basic JUnit test..."
          timeout 30s ant test-plugin -Dplugin=indexer-elastic -Dtest.case=TestElasticIndexWriterIntegration -Dtest.method=testBasicJUnitFunctionality || { 
            echo "Basic JUnit test failed or timed out"; 
            echo "Checking ant processes...";
            ps aux | grep ant || true;
            exit 1; 
          }
          echo "Basic JUnit test successful"
          
          # Run the simplified ES8 integration test
          echo "Step 3: Running simplified ES8 integration test..."
          timeout 60s ant test-plugin -Dplugin=indexer-elastic -Dtest.case=TestElasticIndexWriterIntegration -Dtest.method=testElasticsearch8Integration || { 
            echo "ES8 integration test failed or timed out"; 
            echo "Checking ant processes...";
            ps aux | grep ant || true;
            echo "Checking log files...";
            echo "Skipping log file checks to avoid further hanging issues";
            exit 1; 
          }
          echo "ES8 integration test successful"