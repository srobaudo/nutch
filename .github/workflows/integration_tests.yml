name: integration tests

on: [push]

jobs:
  integration-tests:
    strategy:
      matrix:
        java: ['17']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    services:
      elasticsearch8:
        image: elasticsearch:8.18.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
      elasticsearch9:
        image: elasticsearch:9.0.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.enrollment.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9201:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4.5.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: dorny/paths-filter@v3.0.0
        id: filter
        with:
          filters: |
            elastic:
              - 'src/plugin/indexer-elastic/**'
            buildconf:
              - 'build.xml'
              - 'ivy/ivy.xml'
            workflow:
              - '.github/workflows/**'
      # Only run integration tests if elastic plugin, build config, or workflow changed
      - name: Check Elasticsearch versions
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Checking Elasticsearch services..."
          docker --version
          
      - name: Wait for Elasticsearch Services
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Waiting for Elasticsearch services to be ready..."
          
          # Function to wait for ES instance
          wait_for_es() {
            local port=$1
            local version=$2
            echo "Waiting for ES$version on port $port..."
            
            for i in {1..60}; do
              if curl -s "http://localhost:$port/_cluster/health" > /dev/null 2>&1; then
                local health=$(curl -s "http://localhost:$port/_cluster/health")
                if echo "$health" | grep -q '"status":"green"\|"status":"yellow"'; then
                  echo "ES$version is ready on port $port"
                  echo "Health status: $health"
                  return 0
                fi
              fi
              echo "ES$version not ready yet, waiting... ($i/60)"
              sleep 5
            done
            
            echo "ES$version failed to become ready on port $port"
            return 1
          }
          
          # Wait for both instances
          wait_for_es 9200 8 &
          wait_for_es 9201 9 &
          wait
          
      - name: integration tests
        if: ${{ steps.filter.outputs.elastic == 'true' || steps.filter.outputs.buildconf == 'true' || steps.filter.outputs.workflow == 'true' }}
        run: |
          echo "Starting Elasticsearch integration tests..."
          echo "ES8 available at localhost:9200, ES9 available at localhost:9201"
          
          # Show environment info
          echo "Java version:"
          java -version
          echo "Ant version:"
          ant -version
          echo "Current directory: $(pwd)"
          echo "Available memory: $(free -h)"
          
          # Final health verification
          echo "Final ES8 health check:"
          curl -s http://localhost:9200/_cluster/health | jq '.' || curl -s http://localhost:9200/_cluster/health
          echo ""
          echo "Final ES9 health check:"
          curl -s http://localhost:9201/_cluster/health | jq '.' || curl -s http://localhost:9201/_cluster/health
          echo ""
          
          # Set system properties for log4j2 to prevent infinite loop
          export ANT_OPTS="-Dhadoop.log.dir=/tmp -Dhadoop.log.file=test.log"
          
          # Run simple connectivity test first
          echo "Running connectivity test..."
          timeout 60s ant test-connectivity || { echo "Connectivity test failed or timed out"; exit 1; }
          
          # If connectivity test passes, run ES8 integration test only
          echo "Running ES8 integration test..."
          timeout 120s ant integration-test-es8-only || { echo "ES8 integration test failed or timed out"; exit 1; }